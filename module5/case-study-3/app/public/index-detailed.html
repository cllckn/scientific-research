<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris ML Prediction</title>

    <!-- Socket.IO client loaded from the same Express server -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #f5f5f3;
            color: #1a1a18;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        h1 {
            font-size: 20px;
            font-weight: 500;
            color: #1a1a18;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            font-size: 13px;
            color: #6b6b68;
            margin-top: 4px;
        }

        /* ── Card ── */
        .card {
            background: #ffffff;
            border: 0.5px solid rgba(0,0,0,0.12);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .card-label {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #8a8a87;
            margin-bottom: 1rem;
        }

        /* ── Form ── */
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 1rem;
        }

        .field:last-of-type { margin-bottom: 0; }

        label {
            font-size: 13px;
            font-weight: 500;
            color: #3a3a38;
        }

        input[type="number"] {
            width: 100%;
            height: 38px;
            padding: 0 12px;
            border: 0.5px solid rgba(0,0,0,0.18);
            border-radius: 8px;
            font-size: 14px;
            color: #1a1a18;
            background: #fafaf8;
            outline: none;
            transition: border-color 0.15s;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

        input[type="number"]:focus {
            border-color: rgba(0,0,0,0.4);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        .btn {
            width: 100%;
            height: 40px;
            margin-top: 1.25rem;
            background: #1a1a18;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn:hover  { opacity: 0.85; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Status badge ── */
        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8a8a87;
            margin-top: 0.75rem;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #c4c4c0;
            flex-shrink: 0;
            transition: background 0.3s;
        }

        .dot.connected   { background: #3b9e3b; }
        .dot.sending     { background: #d48b18; }
        .dot.error       { background: #c43c3c; }

        /* ── Result card ── */
        .result-inner {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 56px;
        }

        .result-empty {
            font-size: 13px;
            color: #aaaaaa;
            font-style: italic;
        }

        .prediction-pill {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 500;
            background: #e8f4e8;
            color: #2a6e2a;
            width: fit-content;
        }

        .meta-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meta-key {
            font-size: 11px;
            color: #9a9a97;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .meta-val {
            font-size: 13px;
            font-weight: 500;
            color: #2a2a28;
            font-variant-numeric: tabular-nums;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            padding: 6px 10px;
            background: #f5f5f3;
            border-radius: 6px;
            color: #5a5a58;
        }

        .history-item .species {
            font-weight: 500;
            color: #2a6e2a;
        }

        .history-empty {
            font-size: 12px;
            color: #aaaaaa;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">

    <div>
        <h1>Iris prediction</h1>
        <p class="subtitle">Enter sepal measurements to classify the iris species.</p>
    </div>

    <!-- ── Input form ── -->
    <div class="card">
        <div class="card-label">Measurements</div>

        <div class="field">
            <label for="sepal_length">Sepal length (cm)</label>
            <input id="sepal_length" type="number" step="0.1" min="0" placeholder="e.g. 5.1" />
        </div>

        <div class="field">
            <label for="sepal_width">Sepal width (cm)</label>
            <input id="sepal_width" type="number" step="0.1" min="0" placeholder="e.g. 3.5" />
        </div>

        <button class="btn" id="sendBtn" onclick="sendMeasurement()">Send for prediction</button>

        <div class="status-row">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Connecting…</span>
        </div>
    </div>

    <!-- ── Latest result ── -->
    <div class="card">
        <div class="card-label">Latest prediction</div>
        <div class="result-inner" id="resultArea">
            <span class="result-empty">Waiting for a prediction…</span>
        </div>
    </div>

    <!-- ── History ── -->
    <div class="card">
        <div class="card-label">History</div>
        <ul class="history-list" id="historyList">
            <li class="history-empty" id="historyEmpty">No predictions yet.</li>
        </ul>
    </div>

</div>

<script>
    // ── Socket.IO ──────────────────────────────────────────────
    const socket = io();

    const dot        = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const sendBtn    = document.getElementById("sendBtn");

    const setStatus = (state, text) => {
        dot.className = "dot " + state;
        statusText.textContent = text;
    };

    socket.on("connect", () => {
        setStatus("connected", "Connected");
        sendBtn.disabled = false;
    });

    socket.on("disconnect", () => {
        setStatus("error", "Disconnected — retrying…");
        sendBtn.disabled = true;
    });

    // ── Receive prediction result from Kafka consumer ──────────
    socket.on("model-result", (data) => {
        renderResult(data);
        appendHistory(data);
    });

    // ── Send measurement to REST endpoint ─────────────────────
    async function sendMeasurement() {
        const sepal_length = parseFloat(document.getElementById("sepal_length").value);
        const sepal_width  = parseFloat(document.getElementById("sepal_width").value);

        if (isNaN(sepal_length) || isNaN(sepal_width)) {
            setStatus("error", "Please enter both measurements.");
            return;
        }

        sendBtn.disabled = true;
        setStatus("sending", "Sending…");

        try {
            const res = await fetch("/api/ml-model/predictions", {
                method:  "POST",
                headers: { "Content-Type": "application/json" },
                body:    JSON.stringify({ sepal_length, sepal_width })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || "Server error");
            }

            setStatus("connected", "Queued — awaiting prediction…");
        } catch (err) {
            setStatus("error", "Error: " + err.message);
        } finally {
            sendBtn.disabled = false;
        }
    }

    // ── Render latest result ───────────────────────────────────
    function renderResult(data) {
        const area = document.getElementById("resultArea");

        // Support varied payload shapes from the ML model
        const species    = data.prediction || data.species    || data.class    || "—";
        const confidence = data.confidence || data.probability|| data.score    || null;
        const timestamp  = new Date().toLocaleTimeString();

        let html = `<div class="prediction-pill">${escHtml(species)}</div>`;

        html += `<div class="meta-row">`;
        if (confidence != null) {
            html += `
                <div class="meta-item">
                    <span class="meta-key">Confidence</span>
                    <span class="meta-val">${(parseFloat(confidence) * 100).toFixed(1)}%</span>
                </div>`;
        }
        html += `
            <div class="meta-item">
                <span class="meta-key">Received at</span>
                <span class="meta-val">${timestamp}</span>
            </div>
        </div>`;

        area.innerHTML = html;
    }

    // ── Append to history list ─────────────────────────────────
    function appendHistory(data) {
        const list  = document.getElementById("historyList");
        const empty = document.getElementById("historyEmpty");
        if (empty) empty.remove();

        const species    = data.prediction || data.species || data.class || "—";
        const confidence = data.confidence || data.probability || data.score || null;
        const time       = new Date().toLocaleTimeString();

        const li = document.createElement("li");
        li.className = "history-item";
        li.innerHTML = `
            <span class="species">${escHtml(species)}</span>
            <span>${confidence != null ? (parseFloat(confidence)*100).toFixed(1)+"%" : ""}</span>
            <span>${time}</span>`;

        list.prepend(li);

        // Keep at most 20 entries
        while (list.children.length > 20) list.removeChild(list.lastChild);
    }

    function escHtml(str) {
        return String(str)
            .replace(/&/g,"&amp;").replace(/</g,"&lt;")
            .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
</script>

</body>
</html>
